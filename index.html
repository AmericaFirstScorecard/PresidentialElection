<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Gov Election Center</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Mock Government Election Center</p>
        <h1>Live Presidential Results</h1>
      </div>
      <div id="status" class="status">Loading live feed…</div>
    </header>

    <main>
      <section class="summary-grid">
        <article class="panel">
          <h2>National Outlook</h2>
          <div id="nationalOverview" class="metric-list"></div>
        </article>
        <article class="panel">
          <h2>Called States</h2>
          <div id="calledOverview" class="metric-list"></div>
        </article>
        <article class="panel">
          <h2>Reporting Progress</h2>
          <div id="reportingOverview" class="metric-list"></div>
        </article>
      </section>

      <section class="panel map-panel">
        <div class="map-header">
          <div>
            <h2>U.S. Election Map</h2>
            <p>Zoom in for county shading. Zoom out for state shading.</p>
          </div>
          <div class="legend">
            <span><i class="swatch dem"></i> Democrat</span>
            <span><i class="swatch rep"></i> Republican</span>
            <span><i class="swatch other"></i> Other / Uncalled</span>
          </div>
        </div>
        <div id="electionMap" class="map"></div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
